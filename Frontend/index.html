<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Ticket Dashboard</title>
  <!-- TODO: This page is loading completely unstyled. Add the tag that
       links style.css so the browser picks up the stylesheet. -->
       <link  style{styles.css}  />
</head>
<body>

  <header class="dashboard-header">
    <h1>Support Ticket Dashboard</h1>
    <nav class="filter-panel">
      <button id="filter-all" class="filter-btn active" type="button">Show All</button>
      <button id="filter-critical" class="filter-btn" type="button">Show Critical</button>
      <button id="filter-open" class="filter-btn" type="button">Show Open</button>
    </nav>
  </header>

  <main class="dashboard-main">

    <!-- Reference example card: fixed structure/markup used to test raw HTML + CSS skills -->
    <section class="reference-panel">
      <h2 class="reference-title" class="ticket-card-header " >Example Ticket Card</h2>
      <!-- TODO: This card is missing the classes style.css expects. Using the
           .ticket-card / .ticket-card-header / .badge / .badge-critical /
           .ticket-status / .ticket-meta rules in style.css as your guide,
           add the classes needed so this card matches the styled cards below it. -->
      <article data-status="Open" data-priority="Critical">
        <div class="ticket-card-header">
          <h3 class="ticket-title">Email server down</h3>
          <span styles="badge-critical" >Critical</span>
        </div>
        <div class="ticket-meta">
          <span class="badge">Open</span>
          <span class="ticket-date" style{styles="ticket-meta"} >2026-08-10</span>
        </div>
      </article>
    </section>

    <!-- Dynamic ticket list: populated at runtime by script.js -->
    <section id="ticket-container" class="ticket-grid" aria-live="polite">
    </section>

  </main>

  <!-- TODO: Nothing on this page is interactive yet because script.js is
       never loaded. Add the tag that loads it - and think about where it
       needs to go (here vs. <head>, with or without `defer`) given that
       script.js looks up elements like #ticket-container as soon as it
       runs. -->
</body>
</html>
