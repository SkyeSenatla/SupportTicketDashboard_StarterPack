<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Ticket Dashboard</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="dashboard-header">
    <h1>Support Ticket Dashboard</h1>

    <nav class="filter-panel">
      <button id="filter-all" class="filter-btn active" type="button">
        Show All
      </button>

      <button id="filter-critical" class="filter-btn" type="button">
        Show Critical
      </button>

      <button id="filter-open" class="filter-btn" type="button">
        Show Open
      </button>
    </nav>
  </header>

  <main class="dashboard-main">

    <!-- Reference example card -->
    <section class="reference-panel">
      <h2 class="reference-title">Example Ticket Card</h2>

      <article
        class="ticket-card"
        data-status="Open"
        data-priority="Critical"
      >
        <div class="ticket-card-header">
          <h3 class="ticket-title">Email server down</h3>

          <span class="badge badge-critical">
            Critical
          </span>
        </div>

        <div class="ticket-meta">
          <span class="ticket-status status-open">
            Open
          </span>

          <span class="ticket-date">
            2026-08-10
          </span>
        </div>
      </article>
    </section>

    <!-- Dynamic ticket list: populated at runtime by script.js -->
    <section
      id="ticket-container"
      class="ticket-grid"
      aria-live="polite"
    >
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
